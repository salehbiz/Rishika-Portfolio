<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details | Portfolio</title>
  <link rel="stylesheet" href="styles.css?v=12" />
  <style>
    body {
      background: #ffffff;
      color: #1a1a1a;
      margin: 0;
      padding: 0;
    }
    
    .detail-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 8rem 2rem 6rem;
      min-height: calc(100vh - 400px);
    }

    /* Back Link */
    .back-to-portfolio {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #777777;
      text-decoration: none;
      text-transform: uppercase;
      margin-bottom: 3rem;
      transition: color 0.3s ease;
    }

    .back-to-portfolio:hover {
      color: #1a1a1a;
    }

    /* Split Layout */
    .project-split {
      display: flex;
      flex-direction: row;
      gap: 5rem;
      align-items: flex-start;
      margin-bottom: 6rem;
    }

    .project-media-col {
      width: 55%;
      position: sticky;
      top: 120px;
    }

    .media-box {
      width: 100%;
      border-radius: 0;
      overflow: hidden;
      background: transparent;
      border: none;
      box-shadow: none;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: auto;
    }

    .media-box img, .media-box video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .project-content-col {
      width: 45%;
    }

    .project-title-tag {
      color: #4e6151;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      display: block;
    }

    .project-content-col h1 {
      font-family: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
      font-size: 3rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.1;
      margin: 0 0 1.5rem;
      color: #1a1a1a;
    }

    .project-meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem 2.5rem;
      margin-bottom: 3rem;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
    }

    .meta-item {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: #444444;
      line-height: 1.5;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      padding-bottom: 0.75rem;
    }

    .meta-item strong {
      color: #1a1a1a;
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .project-description-text {
      font-family: 'Inter', sans-serif;
      font-size: 1.05rem;
      line-height: 1.75;
      color: #555555;
      margin-bottom: 3rem;
    }

    .project-action-button {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #ffffff;
      background: #1a1a1a;
      border: 1px solid #1a1a1a;
      padding: 0.95rem 2rem;
      border-radius: 0;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: none;
      transition: all 0.3s ease;
    }

    .project-action-button:hover {
      background: transparent;
      color: #1a1a1a;
      border-color: #1a1a1a;
      box-shadow: none;
      transform: none;
    }

    /* Bottom Slider Navigation */
    .project-nav-divider {
      border: 0;
      height: 1px;
      background: rgba(0, 0, 0, 0.08);
      margin-bottom: 4rem;
    }

    .project-navigation-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-project-btn {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      max-width: 45%;
      transition: all 0.3s ease;
    }

    .nav-project-btn.prev {
      align-items: flex-start;
    }

    .nav-project-btn.next {
      align-items: flex-end;
      text-align: right;
    }

    .nav-project-btn span.nav-dir {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #737373;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      transition: color 0.3s ease;
    }

    .nav-project-btn span.nav-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 500;
      color: #1a1a1a;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .nav-project-btn:hover span.nav-dir {
      color: #4e6151;
    }
    
    .nav-project-btn:hover span.nav-title {
      color: #4e6151;
      transform: translateX(-4px);
    }

    .nav-project-btn.next:hover span.nav-title {
      transform: translateX(4px);
    }

    /* Error View */
    .error-container {
      text-align: center;
      padding: 6rem 2rem;
    }

    .error-container h1 {
      font-family: 'Inter Tight', sans-serif;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    /* Responsive */
    @media (max-width: 992px) {
      .project-split {
        flex-direction: column;
        gap: 3rem;
      }
      .project-media-col, .project-content-col {
        width: 100%;
      }
      .project-media-col {
        position: static;
      }
      .media-box {
        min-height: auto;
      }
    }

    @media (max-width: 768px) {
      .detail-container {
        padding-top: 6rem;
      }
      .project-content-col h1 {
        font-size: 2.25rem;
      }
      .nav-project-btn span.nav-title {
        font-size: 1rem;
      }
      .bottom-split-container {
        flex-direction: column !important;
        gap: 2.5rem !important;
      }
      .bottom-desc-col, .bottom-meta-col {
        width: 100% !important;
      }
    }

    /* Webflow-Style Switcher & Preview Mockups */
    .switcher-btn:hover {
      background: rgba(0,0,0,0.04) !important;
      color: #1a1a1a !important;
    }
    .switcher-btn.active:hover {
      background: #1a1a1a !important;
      color: #ffffff !important;
    }
    
    @media (max-width: 480px) {
      #mobile-viewport-wrapper {
        width: 100% !important;
        height: 600px !important;
        border-width: 6px !important;
        border-radius: 20px !important;
      }
      #mobile-viewport-wrapper iframe, #mobile-viewport-wrapper .scrollable-preview-container {
        padding-top: 0 !important;
      }
      .preview-viewport-container {
        margin-bottom: 3rem !important;
      }
    }

    /* Scrollable screenshot container custom styling */
    .scrollable-preview-container {
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.15) rgba(0, 0, 0, 0.02);
    }
    .scrollable-preview-container::-webkit-scrollbar {
      width: 6px;
    }
    .scrollable-preview-container::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.02);
    }
    .scrollable-preview-container::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 3px;
    }
    .scrollable-preview-container::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }
    /* Rogers project mockups & 3D perspective gallery custom styles */
    .perspective-track-outer {
      scrollbar-width: none;
    }
    .perspective-track-outer::-webkit-scrollbar {
      display: none;
    }
    .voyager-card {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .voyager-card:hover {
      transform: rotateY(0deg) scale(1.08) translateZ(40px) !important;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15) !important;
      z-index: 10;
    }
    .mobile-mockup-frame {
      transition: transform 0.3s ease;
    }
    .mobile-mockup-frame:hover {
      transform: translateY(-5px);
    }

    /* Instagram Feed Mockup Grid rules */
    .instagram-grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      max-width: 1200px;
      margin: 3rem auto 6rem;
      padding: 0 1rem;
      box-sizing: border-box;
    }
    @media (max-width: 992px) {
      .instagram-grid-container {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 1.5rem !important;
      }
    }
    @media (max-width: 640px) {
      .instagram-grid-container {
        grid-template-columns: 1fr !important;
        gap: 1.5rem !important;
      }
      .bottom-split-container {
        flex-direction: column !important;
        gap: 2.5rem !important;
      }
      .bottom-desc-col, .bottom-meta-col {
        width: 100% !important;
      }
    }

    /* Slider nav hover transitions */
    .insta-media-viewport:hover .insta-nav-btn {
      opacity: 0.85;
    }
    .insta-media-viewport:hover .prev-btn {
      opacity: 0.85;
    }
    .insta-media-viewport:hover .next-btn {
      opacity: 0.85;
    }
    .insta-nav-btn:hover {
      background: #ffffff !important;
      opacity: 1 !important;
    }
    
    /* Zoom styles for images in grid and hover states */
    .insta-media {
      cursor: zoom-in;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .insta-media:hover {
      transform: scale(1.02);
    }

    /* Hide scrollbar for Airtel email body mockup */
    .email-client-body::-webkit-scrollbar {
      display: none;
    }
    .email-client-body {
      scrollbar-width: none;
    }
  </style>
</head>

  <script>
    (function() {
      // Dynamically load database with cache buster to prevent local browser caching
      const dbScript = document.createElement('script');
      dbScript.src = 'projects-data.js?v=' + Date.now();
      dbScript.onload = function() {
        initPage();
      };
      document.head.appendChild(dbScript);

      function initPage() {
        function initRogersScrollPerspective() {
          const trackOuter = document.querySelector('.perspective-track-outer');
          const cards = document.querySelectorAll('.voyager-card');
          if (!trackOuter || cards.length === 0) return;

          const updateRotations = () => {
            const rectOuter = trackOuter.getBoundingClientRect();
            const centerX = rectOuter.left + rectOuter.width / 2;

            cards.forEach(card => {
              const rectCard = card.getBoundingClientRect();
              const cardCenterX = rectCard.left + rectCard.width / 2;
              const distanceFromCenter = cardCenterX - centerX;
              const maxDistance = rectOuter.width / 2;

              let ratio = distanceFromCenter / maxDistance;
              ratio = Math.max(-1, Math.min(1, ratio));

              const rotateY = ratio * -12; // 12 deg max angle
              const translateZ = Math.abs(ratio) * -40; // shift back slightly

              if (!card.matches(':hover')) {
                card.style.transform = `rotateY(${rotateY}deg) translateZ(${translateZ}px)`;
              }
            });
          };

          trackOuter.addEventListener('scroll', updateRotations);
          window.addEventListener('resize', updateRotations);
          setTimeout(updateRotations, 100);
        }

        function initAirtelScrollPerspective() {
          const trackOuter = document.querySelector('.airtel-perspective-track-outer');
          const cards = document.querySelectorAll('.airtel-voyager-card');
          if (!trackOuter || cards.length === 0) return;

          const updateRotations = () => {
            const rectOuter = trackOuter.getBoundingClientRect();
            const centerX = rectOuter.left + rectOuter.width / 2;

            cards.forEach(card => {
              const rectCard = card.getBoundingClientRect();
              const cardCenterX = rectCard.left + rectCard.width / 2;
              const distanceFromCenter = cardCenterX - centerX;
              const maxDistance = rectOuter.width / 2;

              let ratio = distanceFromCenter / maxDistance;
              ratio = Math.max(-1, Math.min(1, ratio));

              const rotateY = ratio * -12; // 12 deg max angle
              const translateZ = Math.abs(ratio) * -40; // shift back slightly

              if (!card.matches(':hover')) {
                card.style.transform = `rotateY(${rotateY}deg) translateZ(${translateZ}px)`;
              }
            });
          };

          trackOuter.addEventListener('scroll', updateRotations);
          window.addEventListener('resize', updateRotations);
          setTimeout(updateRotations, 100);
        }

        function initInstagramInteractions(posts) {
          // A. Setup Swipes & Dot indicator updates
          const cardContainers = document.querySelectorAll('.instagram-post-card');
          cardContainers.forEach((card) => {
            const viewport = card.querySelector('.insta-media-viewport');
            if (!viewport) return;
            const postIdx = parseInt(viewport.getAttribute('data-post-idx'));
            const post = posts[postIdx];
            if (post.type !== 'carousel') return;

            const track = viewport.querySelector('.insta-slides-track');
            const dots = viewport.querySelectorAll('.insta-dot');
            const counter = viewport.querySelector('.insta-slide-counter');
            const btnPrev = viewport.querySelector('.prev-btn');
            const btnNext = viewport.querySelector('.next-btn');

            let currentSlide = 0;
            const totalSlides = post.images.length;

            const updateSlider = () => {
              track.style.transform = `translateX(-${currentSlide * 100}%)`;
              // Dots update
              dots.forEach((dot, idx) => {
                dot.style.background = idx === currentSlide ? '#0095f6' : 'rgba(255,255,255,0.6)';
              });
              // Counter update
              if (counter) counter.textContent = `${currentSlide + 1}/${totalSlides}`;
              
              // Button opacity checks
              btnPrev.style.opacity = currentSlide === 0 ? '0' : '1';
              btnNext.style.opacity = currentSlide === totalSlides - 1 ? '0' : '1';
            };

            // Initial button states
            btnPrev.style.opacity = '0';
            btnNext.style.opacity = totalSlides > 1 ? '1' : '0';

            // Click Handlers
            btnPrev.addEventListener('click', (e) => {
              e.stopPropagation();
              if (currentSlide > 0) {
                currentSlide--;
                updateSlider();
              }
            });

            btnNext.addEventListener('click', (e) => {
              e.stopPropagation();
              if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateSlider();
              }
            });
          });

          // B. Like Triggers (Single click on SVG, Double click on image)
          cardContainers.forEach((card) => {
            const viewport = card.querySelector('.insta-media-viewport');
            const likeBtn = card.querySelector('.insta-like-btn');
            const heartSvg = likeBtn ? likeBtn.querySelector('.heart-icon-svg') : null;
            const likesLabel = card.querySelector('.insta-likes-label');
            const heartPopup = card.querySelector('.heart-popup');

            let isLiked = false;
            let likesCount = 127;

            const toggleLike = () => {
              isLiked = !isLiked;
              if (isLiked) {
                likesCount++;
                if (heartSvg) {
                  heartSvg.setAttribute('fill', '#ef4444');
                  heartSvg.setAttribute('stroke', '#ef4444');
                }
                if (likeBtn) likeBtn.style.transform = 'scale(1.2)';
                setTimeout(() => { if (likeBtn) likeBtn.style.transform = 'scale(1)'; }, 200);
              } else {
                likesCount--;
                if (heartSvg) {
                  heartSvg.setAttribute('fill', 'none');
                  heartSvg.setAttribute('stroke', 'currentColor');
                }
              }
              if (likesLabel) likesLabel.textContent = `${likesCount} likes`;
            };

            if (likeBtn) likeBtn.addEventListener('click', toggleLike);

            // Double-click on images inside track
            const imgs = card.querySelectorAll('.insta-media');
            imgs.forEach(img => {
              img.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                if (!isLiked) toggleLike();
                
                if (heartPopup) {
                  heartPopup.style.transform = 'translate(-50%, -50%) scale(1)';
                  heartPopup.style.opacity = '0.9';
                  setTimeout(() => {
                    heartPopup.style.transform = 'translate(-50%, -50%) scale(0)';
                    heartPopup.style.opacity = '0';
                  }, 600);
                }
              });
            });
          });

          // C. Fullscreen Lightbox logic
          const lightbox = document.getElementById('insta-lightbox');
          const lightboxImg = document.getElementById('lightbox-img');
          const lightboxClose = document.getElementById('lightbox-close');
          const lightboxPrev = document.getElementById('lightbox-prev');
          const lightboxNext = document.getElementById('lightbox-next');
          const lightboxCaption = document.getElementById('lightbox-caption');

          let allMediaImages = [];
          let currentLightboxIdx = 0;

          // Collect all image URLs in structural order of the layout feed
          posts.forEach((post) => {
            post.images.forEach(imgUrl => {
              allMediaImages.push(imgUrl);
            });
          });

          const openLightbox = (idx) => {
            currentLightboxIdx = idx;
            lightboxImg.src = allMediaImages[currentLightboxIdx];
            lightboxCaption.textContent = `Asset ${currentLightboxIdx + 1} of ${allMediaImages.length}`;
            lightbox.style.display = 'flex';
            setTimeout(() => {
              lightbox.style.opacity = '1';
            }, 50);
          };

          const closeLightbox = () => {
            lightbox.style.opacity = '0';
            setTimeout(() => {
              lightbox.style.display = 'none';
            }, 300);
          };

          // Attach click events on images for Lightbox triggers
          const mediaImages = document.querySelectorAll('.insta-media');
          mediaImages.forEach((img, index) => {
            img.addEventListener('click', (e) => {
              // Only trigger if click wasn't on slider nav controls
              if (e.target.classList.contains('insta-media')) {
                openLightbox(index);
              }
            });
          });

          if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
          
          if (lightboxPrev) {
            lightboxPrev.addEventListener('click', () => {
              if (currentLightboxIdx > 0) {
                currentLightboxIdx--;
                lightboxImg.src = allMediaImages[currentLightboxIdx];
                lightboxCaption.textContent = `Asset ${currentLightboxIdx + 1} of ${allMediaImages.length}`;
              }
            });
          }

          if (lightboxNext) {
            lightboxNext.addEventListener('click', () => {
              if (currentLightboxIdx < allMediaImages.length - 1) {
                currentLightboxIdx++;
                lightboxImg.src = allMediaImages[currentLightboxIdx];
                lightboxCaption.textContent = `Asset ${currentLightboxIdx + 1} of ${allMediaImages.length}`;
              }
            });
          }

          // Keyboard bindings for convenience
          document.addEventListener('keydown', (e) => {
            if (lightbox && lightbox.style.display === 'flex') {
              if (e.key === 'Escape') closeLightbox();
              if (e.key === 'ArrowLeft' && currentLightboxIdx > 0) lightboxPrev.click();
              if (e.key === 'ArrowRight' && currentLightboxIdx < allMediaImages.length - 1) lightboxNext.click();
            }
          });

          // Close on click outside content image area
          lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
          });
        }

        // Get Project ID from Query URL
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        const container = document.getElementById('project-detail-content');

        if (!projectId || typeof projectsData === 'undefined') {
          renderError("No project specified.");
          return;
        }

        // Find project details
        const projectIndex = projectsData.findIndex(p => p.id === projectId);
        if (projectIndex === -1) {
          renderError("Project not found.");
          return;
        }

        const project = projectsData[projectIndex];
        
        // Update browser page title
        document.title = `${project.title} | Rishika's Portfolio`;

        // Next / Prev Projects
        const prevProject = projectsData[(projectIndex - 1 + projectsData.length) % projectsData.length];
        const nextProject = projectsData[(projectIndex + 1) % projectsData.length];

        // Helper to build a CSS phone frame mockup containing an Instagram grid
        function buildPhoneGridHTML(images, id) {
          const handle = id === 'apple' ? 'indiaistore' : (id === 'storia' ? 'storiafoods' : 'canadiansimglobal');
          const avatarLetter = id === 'apple' ? 'AP' : (id === 'storia' ? 'ST' : 'CS');
          const label = id === 'apple' ? 'India iStore' : (id === 'storia' ? 'Storia Foods' : 'CanadianSIM');
          
          return `
            <div class="phone-frame-mockup" style="width: 320px; height: 580px; border: 12px solid #1a1a1a; border-radius: 36px; background: #fafafa; box-shadow: 0 20px 40px rgba(0,0,0,0.06); overflow: hidden; display: flex; flex-direction: column; position: relative; margin: 0 auto;">
              <!-- Speaker & Camera notch -->
              <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 140px; height: 20px; background: #1a1a1a; border-bottom-left-radius: 14px; z-index: 100; display: flex; align-items: center; justify-content: center;">
                <span style="width: 40px; height: 3px; background: #333333; border-radius: 1.5px;"></span>
              </div>
              
              <!-- Instagram/Phone screen header -->
              <div style="height: 48px; border-bottom: 1px solid #eaeaea; display: flex; align-items: center; justify-content: center; padding-top: 14px; font-weight: 700; font-family: 'Inter', sans-serif; font-size: 0.8rem; color: #1a1a1a; background: #ffffff; user-select: none;">
                ${handle}
              </div>
              
              <!-- Grid Container (Scrollable) -->
              <div style="flex: 1; overflow-y: auto; background: #ffffff; padding: 2px;" class="phone-grid-scroll">

              <a href="project.html?id=${nextProject.id}" class="nav-project-btn next">
                <span class="nav-dir">Next Project &rarr;</span>
                <span class="nav-title">${nextProject.title}</span>
              </a>
            </div>
          `;
        }

        // Attach listener for the archive expander drawer
        const toggleBtn = document.getElementById('toggle-archive-btn');
        const archiveContainer = document.getElementById('project-archive-container');
        
        if (toggleBtn && archiveContainer) {
          let isExpanded = false;
          const originalText = toggleBtn.innerText;
          
          toggleBtn.addEventListener('click', () => {
            isExpanded = !isExpanded;
            if (isExpanded) {
              archiveContainer.style.maxHeight = (archiveContainer.scrollHeight + 1000) + 'px';
              archiveContainer.style.opacity = '1';
              toggleBtn.innerText = 'Collapse Archive';
              toggleBtn.style.background = '#ffffff';
              toggleBtn.style.color = '#000000';
              toggleBtn.style.borderColor = '#ffffff';
            } else {
              archiveContainer.style.maxHeight = '0px';
              archiveContainer.style.opacity = '0';
              toggleBtn.innerText = originalText;
              toggleBtn.style.background = 'rgba(255,255,255,0.05)';
              toggleBtn.style.color = '#ffffff';
              toggleBtn.style.borderColor = 'rgba(255,255,255,0.15)';
              
              // Scroll start element back into view smoothly
              archiveContainer.previousElementSibling.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        }

        function renderError(message) {
          container.innerHTML = `
            <div class="error-container">
              <h1>Oops!</h1>
              <p style="color:#a3a3a3; font-family:'Inter',sans-serif; margin-bottom:2rem;">${message}</p>
              <a href="index.html" class="project-action-button">Back to Homepage</a>
            </div>
          `;
        }

        // ===================== PARTICLES =====================
        const pCanvas = document.getElementById('particles-canvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];

        function resizeParticles() {
          pCanvas.width = window.innerWidth;
          pCanvas.height = window.innerHeight;
          createParticles();
        }

        function createParticles() {
          particles = [];
          const count = Math.floor((pCanvas.width * pCanvas.height) / 12000);
          for (let i = 0; i < count; i++) {
            particles.push({
              x: Math.random() * pCanvas.width,
              y: Math.random() * pCanvas.height,
              vx: (Math.random() - 0.5) * 0.3,
              vy: (Math.random() - 0.5) * 0.3,
              size: Math.random() * 1.5 + 0.5,
              opacity: Math.random() * 0.6 + 0.2
            });
          }
        }

        function animateParticles() {
          pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
          for (const p of particles) {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = pCanvas.width;
            if (p.x > pCanvas.width) p.x = 0;
            if (p.y < 0) p.y = pCanvas.height;
            if (p.y > pCanvas.height) p.y = 0;
            pCtx.beginPath();
            pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            pCtx.fillStyle = `rgba(255,255,255,${p.opacity})`;
            pCtx.fill();
          }
          requestAnimationFrame(animateParticles);
        }

        resizeParticles();
        window.addEventListener('resize', resizeParticles);
        animateParticles();
      }
    })();
  </script>
</body>
</html>
